name: Обновление курсов

on:
  schedule:
    # 17:40 МСК — ЦБ РФ публикует курс на следующий день около 11:30–12:00 МСК
    - cron: '40 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Забрать курсы ЦБ РФ
        run: node scripts/fetch-rates.mjs

      - name: Закоммитить изменения
        run: |
          if git diff --quiet -- data/rates.json; then
            echo "Данные не изменились"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git commit -m "Курсы ЦБ РФ: $(date -u +%Y-%m-%d)"
          git push
