name: Обновление данных

on:
  schedule:
    # 17:40 МСК — ЦБ РФ публикует курс на следующий день около 11:30–12:00 МСК,
    # к этому времени на Мосбирже уже закрыта основная сессия
    - cron: '40 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Курсы ЦБ РФ
        continue-on-error: true
        run: node scripts/fetch-rates.mjs

      - name: Котировки Мосбиржи
        continue-on-error: true
        run: node scripts/fetch-stocks.mjs

      - name: Сводка
        run: git diff --stat -- data/rates.json data/stocks.json

      - name: Закоммитить изменения
        run: |
          if git diff --quiet -- data/rates.json data/stocks.json; then
            echo "Данные не изменились"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json data/stocks.json
          git commit -m "Данные: $(date -u +%Y-%m-%d)"
          git push
