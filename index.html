<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Рафики</title>
  <link rel="stylesheet" href="styles.css?v=16">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>Рафики</h1>
      <button type="button" class="ghost" id="layout-reset" hidden>Сбросить раскладку</button>
    </header>

    <div class="desk" id="desk">
      <section class="card panel" id="panel-fx" data-panel="fx" aria-labelledby="usd-title">
        <div class="card-head" data-drag>
          <div class="card-title">
            <h2 id="usd-title">Доллар США / рубль</h2>
            <p class="meta" id="usd-meta">загрузка…</p>
          </div>
          <div class="value" id="usd-value">—</div>
        </div>

        <div class="ranges" id="usd-ranges" role="group" aria-label="Период"></div>

        <div class="toggles">
          <button type="button" class="chip" id="rate-toggle" aria-pressed="true">
            <span class="chip-dash" aria-hidden="true"></span>Ключевая ставка, %
          </button>
          <button type="button" class="chip chip-psb" id="pskb-toggle" aria-pressed="true" hidden>
            <span class="chip-line" aria-hidden="true"></span>Примсоцбанк, продажа
          </button>
        </div>

        <div class="chart-box">
          <canvas id="usd-chart" aria-label="График курса доллара к рублю" role="img"></canvas>
          <p class="chart-error" id="usd-error" hidden></p>
          <button type="button" class="chart-reset" id="usd-reset" hidden>Сброс масштаба</button>
        </div>
      </section>

      <section class="card panel" id="panel-stocks" data-panel="stocks" aria-labelledby="stocks-title">
        <div class="card-head" data-drag>
          <div class="card-title">
            <p class="eyebrow" id="stocks-title">Акции</p>
            <h2 id="stock-name">загрузка…</h2>
            <p class="meta" id="stocks-meta">—</p>
          </div>
          <div class="value" id="stock-value">—</div>
        </div>

        <div class="ranges" id="stocks-ranges" role="group" aria-label="Период"></div>

        <div class="toggles">
          <button type="button" class="chip chip-index" id="imoex-toggle" aria-pressed="true" hidden>
            <span class="chip-line" aria-hidden="true"></span>Индекс МосБиржи
          </button>
        </div>

        <div class="stocks-body">
          <div class="chart-box">
            <canvas id="stock-chart" aria-label="График цены акции" role="img"></canvas>
            <p class="chart-error" id="stocks-error" hidden></p>
            <button type="button" class="chart-reset" id="stock-reset" hidden>Сброс масштаба</button>
          </div>

          <div class="tiles" id="stock-tiles" role="group" aria-label="Выбор бумаги"></div>
        </div>
      </section>
    </div>

    <footer class="foot">
      Источники: <a href="https://www.cbr.ru/currency_base/dynamics/" rel="noopener">ЦБ РФ</a> (валюты),
      <a href="https://www.moex.com/" rel="noopener">Мосбиржа</a> (акции).
      Обновлено: валюты — <span id="updated-fx">—</span>, акции — <span id="updated-stocks">—</span>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
  <script src="app.js?v=18"></script>
</body>
</html>
